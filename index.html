<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Golden Chance</title>
  <meta name="description" content="Golden Chance — weekly draw for our private Ekub group." />

  <!-- Telegram Mini App bridge. Exposes window.Telegram.WebApp when
       running inside Telegram. See js/telegram.js for how (and how
       NOT) this is used. Safe to load in a plain browser too — it
       simply won't attach anything there (and, since there's no
       initData outside Telegram, login will correctly fail there too). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Official Supabase JS client (UMD build, no bundler needed). Exposes
       the global `supabase.createClient(...)`. This is the client SDK
       required to talk to Supabase at all — not a framework. -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="17.5" stroke="#c07f22" stroke-width="2"/>
          <circle cx="20" cy="4.5" r="2.6" fill="#c07f22"/>
          <circle cx="32.5" cy="13" r="2.6" fill="#e6dac2"/>
          <circle cx="32.5" cy="27" r="2.6" fill="#e6dac2"/>
          <circle cx="20" cy="35.5" r="2.6" fill="#e6dac2"/>
          <circle cx="7.5" cy="27" r="2.6" fill="#e6dac2"/>
          <circle cx="7.5" cy="13" r="2.6" fill="#e6dac2"/>
        </svg>
        <div>
          <div class="brand-name">Golden Chance</div>
          <div class="brand-sub">Private weekly draw</div>
        </div>
      </div>
      <span class="env-badge" id="env-badge">Checking environment…</span>
    </header>

    <!-- Populated by main.js so its icons come from the single
         icons.js source of truth instead of being duplicated here. -->
    <nav class="bottom-nav" aria-label="Primary" id="bottom-nav"></nav>

    <main>
      <section id="screen-home" class="screen is-active" aria-label="Home"></section>
      <section id="screen-member" class="screen" aria-label="My status"></section>
      <section id="screen-draw" class="screen" aria-label="Draw"></section>
      <section id="screen-history" class="screen" aria-label="Winner history"></section>
      <section id="screen-admin" class="screen" aria-label="Admin"></section>
    </main>
  </div>

  <!-- Load order matters: config/client/telegram must exist before api.js
       uses them, and api.js must exist before ui.js/draw.js call it. -->
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/state.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/api.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
